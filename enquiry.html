<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Sets the character encoding -->
    <meta charset="UTF-8">

    <!-- Page title displayed on the browser tab and used by search engines -->
    <title>Enquiries | Uncle's Wife Cleaning Detergents</title>

    <!-- Makes the website responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Description used by search engines -->
    <meta name="description" content="Send an enquiry to Uncle's Wife Cleaning Detergents about dishwashing liquid, bleach and other household cleaning products in Duduza, South Africa.">

    <!-- Links the HTML page to the external CSS file -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Loads Poppins and Open Sans fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- ================= WEBSITE HEADER ================= -->
    <header>

        <!-- Business logo; the images folder is outside the js folder -->
        <img src="../images/logo.png"
             alt="Uncle's Wife Cleaning Detergents business logo"
             class="logo">

        <!-- Website navigation menu -->
        <nav aria-label="Main navigation">

            <ul>

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about_us.html">About Us</a>
                </li>

                <li>
                    <a href="contact.html">Our Contacts</a>
                </li>

                <!-- Identifies the current page -->
                <li>
                    <a href="enquiry.html" aria-current="page">Enquiries</a>
                </li>

                <li>
                    <a href="products.html">Products</a>
                </li>

                <li>
                    <a href="services.html">Services</a>
                </li>

            </ul>

        </nav>

    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main>

        <!-- Main heading for the Enquiries page -->
        <h1>Make an Enquiry</h1>

        <p>
            Have a question about our business, cleaning products
            or services? Please complete the form below and provide
            the details of your enquiry.
        </p>

        <!-- ================= ENQUIRY FORM ================= -->
        <form id="enquiryForm" class="enquiry-form">

            <!-- Full name field -->
            <label for="name">Full Name:</label>

            <input
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                required
            >

            <!-- Email field -->
            <label for="email">Email Address:</label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <!-- Phone number field -->
            <label for="phone">Phone Number:</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                autocomplete="tel"
                pattern="[0-9+\s()-]{10,20}"
                title="Enter a valid phone number using 10 to 20 characters."
                required
            >

            <!-- Enquiry type -->
            <label for="enquiryType">Enquiry Type:</label>

            <select id="enquiryType" name="enquiryType" required>

                <option value="">Select an enquiry type</option>

                <option value="Products">Products</option>

                <option value="Services">Services</option>

                <option value="Volunteer or Sponsorship">
                    Volunteer or Sponsorship
                </option>

                <option value="Other">Other</option>

            </select>

            <!-- Enquiry message -->
            <label for="message">Your Enquiry:</label>

            <textarea
                id="message"
                name="message"
                rows="5"
                minlength="10"
                maxlength="1000"
                placeholder="Please describe your enquiry..."
                required
            ></textarea>

            <!-- Submit button -->
            <button type="submit">
                Submit Enquiry
            </button>

        </form>

        <!-- Area where JavaScript displays the form response -->
        <div id="enquiryResponse"
             role="status"
             aria-live="polite"></div>

    </main>

    <!-- ================= WEBSITE FOOTER ================= -->
    <footer>

        <p>
            &copy; <span id="year">2026</span>
            Uncle's Wife Cleaning Detergents. All rights reserved.
        </p>

    </footer>

    <!-- Links to script.js in the same js folder -->
    <script src="script.js"></script>

</body>

</html>
