<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Page title -->
    <title>Enquiry - Uncle's Wife Cleaning Detergents</title>

    <!-- Makes the website responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Links to the external CSS stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Loads Poppins and Open Sans fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- ================= WEBSITE HEADER ================= -->

    <header>
         <!-- Business logo -->
        <img src="images/logo.png" alt="Uncle's Wife Cleaning Detergents Logo" class="logo">

        <!-- Website navigation -->
        <nav>

            <ul>

                <!-- Home page -->
                <li>
                    <a href="index.html">Home</a>
                </li>

                <!-- About Us page -->
                <li>
                    <a href="about_us.html">About Us</a>
                </li>

                <!-- Contact page -->
                <li>
                    <a href="contact.html">Our Contacts</a>
                </li>

                <!-- Enquiries page -->
                <li>
                    <a href="enquiry.html">Enquiries</a>
                </li>

                <!-- Products page -->
                <li>
                    <a href="products.html">Products</a>
                </li>

                <!-- Services page -->
                <li>
                    <a href="services.html">Services</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main>

        <h2>Make an Enquiry</h2>

        <p>
            Have a question about our business or products?
            Please complete the form below.
        </p>


        <!-- ================= ENQUIRY FORM ================= -->

        <form id="enquiryForm" class="enquiry-form">

            <!-- Full name field -->
            <label for="name">Full Name:</label>

            <input type="text" id="name">


            <!-- Email field -->
            <label for="email">Email Address:</label>

            <input type="email" id="email">


            <!-- Phone number field -->
            <label for="phone">Phone Number:</label>

            <input type="tel" id="phone">


            <!-- Enquiry message field -->
            <label for="message">Your Enquiry:</label>

            <textarea id="message" rows="5"></textarea>


            <!-- Submit button -->
            <button type="submit">
                Submit Enquiry
            </button>

        </form>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>© 2026 Uncle's Wife Cleaning Detergents</p>

    </footer>


    <!-- Links to JavaScript -->
    <script src="script.js"></script>

</body>

</html>
